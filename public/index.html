<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keep Proxy Gateway · 服务代理转发管理后台</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/admin/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">KG</div>
      <div class="brand-name">Keep Proxy<small>服务代理转发网关</small></div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="overview">概览</button>
      <button class="nav-item" data-view="rules">转发规则</button>
      <button class="nav-item" data-view="playground">逻辑调试</button>
      <button class="nav-item" data-view="logs">请求日志</button>
    </nav>
    <div class="sidebar-foot">
      <div class="server-status"><span class="dot" id="srv-dot"></span><span id="srv-text">连接中…</span></div>
      <button class="btn btn-ghost btn-block" id="btn-settings">设置</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <h1 id="page-title">概览</h1>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>
<div id="toast-root"></div>
<div id="modal-root"></div>
<script src="/admin/app.js"></script>
</body>
</html>
